spring.datasource.url=jdbc:h2:mem:pawpal;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.deserialization.accept-float-as-int=false
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@example.com
pawpal.upload-directory=./target/test-uploads
logging.level.root=WARN

spring.jpa.open-in-view=true

pawpal.expiry.enabled=true
pawpal.expiry.interval=60000000
