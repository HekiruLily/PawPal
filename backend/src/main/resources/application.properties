spring.datasource.url=${PAWPAL_DB_URL:jdbc:mysql://localhost:3306/pet_shop?connectionTimeZone=Asia/Ho_Chi_Minh}
spring.datasource.username=${PAWPAL_DB_USER:root}
spring.datasource.password=${PAWPAL_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${PAWPAL_DDL_AUTO:update}
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.deserialization.accept-float-as-int=false
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.mail.host=${PAWPAL_MAIL_HOST:localhost}
spring.mail.port=${PAWPAL_MAIL_PORT:1025}
spring.mail.username=${PAWPAL_MAIL_USER:}
spring.mail.password=${PAWPAL_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${PAWPAL_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${PAWPAL_MAIL_TLS:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${PAWPAL_SECURE_COOKIE:false}
pawpal.allowed-origins=${PAWPAL_ALLOWED_ORIGINS:http://localhost:8081}
pawpal.upload-directory=${PAWPAL_UPLOAD_DIRECTORY:./uploads}
pawpal.firebase.enabled=${PAWPAL_FIREBASE_ENABLED:false}
pawpal.firebase.booking-scope=${PAWPAL_FIREBASE_BOOKING_SCOPE:legacy}
pawpal.firebase.credentials-file=${PAWPAL_FIREBASE_CREDENTIALS_FILE:}
pawpal.firebase.project-id=${PAWPAL_FIREBASE_PROJECT_ID:pawpal-e40a5}
pawpal.firebase.database-url=${PAWPAL_FIREBASE_DATABASE_URL:https://pawpal-e40a5-default-rtdb.asia-southeast1.firebasedatabase.app}
