# Run the backend on the host; MySQL runs in Docker on a loopback-only port.
# Spring loads the same simple KEY=value file used by Docker Compose.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/${MYSQL_DATABASE:pet_shop}?connectionTimeZone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER:pawpal}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
